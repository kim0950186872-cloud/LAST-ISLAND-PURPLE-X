plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.purplex.analyzer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.purplex.analyzer'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
